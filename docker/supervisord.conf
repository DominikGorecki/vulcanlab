[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql_error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
startsecs=10
stopwaitsecs=30

[program:backend]
command=/opt/venv/bin/uvicorn vulcanlab_api.main:app --host 0.0.0.0 --port 8000
directory=/app
user=root
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend_error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
environment=PYTHONPATH="/app/src",PATH="/opt/venv/bin:/usr/local/bin:/usr/bin:/bin",VULCANLAB_CONFIG="/app/vulcanlab.config.json",POSTGRES_ADMIN_PASSWORD="%(ENV_POSTGRES_ADMIN_PASSWORD)s",POSTGRES_APP_PASSWORD="%(ENV_POSTGRES_APP_PASSWORD)s",LLM_GOOGLE_API_KEY="%(ENV_LLM_GOOGLE_API_KEY)s",LLM_OPENAI_API_KEY="%(ENV_LLM_OPENAI_API_KEY)s"
startsecs=5
stopwaitsecs=10

[program:frontend]
command=node /app/vulcanlab_ui/server.js
directory=/app/vulcanlab_ui
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/frontend.log
stderr_logfile=/var/log/supervisor/frontend_error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
environment=NODE_ENV="production",NEXT_PUBLIC_API_URL="http://localhost:8000",PORT="3000",HOSTNAME="0.0.0.0"
startsecs=5
stopwaitsecs=10
