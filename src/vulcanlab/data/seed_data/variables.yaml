variables:
- function_tag: heading_hierarchy
  variables:
  - variable_name: title
    variable_description: The document title string used to identify the work whose
      headings and structure are being normalized.
  - variable_name: authors
    variable_description: The author or authors of the document, providing context
      that may help the model recognize the work and its typical structure.
  - variable_name: toc_text
    variable_description: The table of contents text from the database, including
      headings and their order, serving as the authoritative high level outline for
      aligning heading levels.
  - variable_name: titles_codeblock
    variable_description: The raw list of current document headings, each with its
      original line number and heading text, that must be relabeled with correct markdown
      levels or removal actions.
- function_tag: markdown_heading_hierarchy
  variables:
  - variable_name: title
    variable_description: The document title string used to identify the work whose
      headings and structure are being normalized.
  - variable_name: authors
    variable_description: The author or authors of the document, providing context
      that may help the model recognize the work and its typical structure.
  - variable_name: toc_text
    variable_description: The table of contents text from the database, including
      headings and their order, serving as the authoritative high level outline for
      aligning heading levels.
  - variable_name: titles_codeblock
    variable_description: The raw list of current document headings, each with its
      original line number and heading text, that must be relabeled with correct markdown
      levels or removal actions.
- function_tag: query_expansion
  variables:
  - variable_name: n
    variable_description: The number of alternative query reformulations the assistant
      must generate for multi-query expansion, controlling how many distinct search-style
      variants are produced.
  - variable_name: query
    variable_description: The original user query or information need, expressed in
      natural language, that the assistant will expand, answer hypothetically, classify
      by intent, and use to extract key entities.
- function_tag: rag_augmentation
  variables:
  - variable_name: intent
    variable_description: The high-level intent label for the user's question (e.g.,
      DEFINITION, MECHANISM, COMPARISON) that guides how the answer should be structured
      and emphasized.
  - variable_name: entities_str
    variable_description: A string listing the key entities, theories, and constructs
      relevant to the question, used to focus the explanation on the most important
      concepts.
  - variable_name: context_blocks
    variable_description: The set of retrieved source passages, each labeled with
      [S#] and optional metadata, that serve as the primary evidence base for constructing
      the answer and citations.
  - variable_name: user_question
    variable_description: The original natural-language question posed by the user
      that the assistant must answer using the provided context and hybrid evidence
      policy.
- function_tag: vectorization_suggestions
  variables:
  - variable_name: bib_section
    variable_description: Optional bibliographic or citation information for the document,
      providing context about the work whose headings are being evaluated for vectorization.
  - variable_name: titles_content
    variable_description: The raw markdown-style list of document headings, including
      line numbers and title text, that must be analyzed and labeled as SKIP or VECTORIZE.
- function_tag: simple_sanitize_small
  variables:
  - variable_name: markdown
    variable_description: The raw markdown document content to be sanitized, including
      headings, text, and any conversion artifacts that need to be cleaned up for RAG indexing.
- function_tag: simple_sanitize_large
  variables:
  - variable_name: condensed_document
    variable_description: A condensed representation of a large document showing each
      heading with contextual sentences, used for determining heading-level modifications
      without processing the entire document.
- function_tag: eval_default
  variables:
  - variable_name: prompt
    variable_description: The original question or task prompt that both answers are
      responding to, used as the basis for comparative evaluation.
  - variable_name: answer_a
    variable_description: The first answer to be evaluated, presented without indicating
      which system or approach generated it.
  - variable_name: answer_b
    variable_description: The second answer to be evaluated, presented without indicating
      which system or approach generated it.
- function_tag: research_planning
  variables:
  - variable_name: name
    variable_description: The name of the research collection being analyzed.
  - variable_name: description
    variable_description: A description of the research collection and its purpose.
  - variable_name: tags
    variable_description: Comma-separated tags associated with the research collection.
  - variable_name: item_count
    variable_description: The total number of items in the collection.
  - variable_name: excerpt_count
    variable_description: The number of excerpt items in the collection.
  - variable_name: research_result_count
    variable_description: The number of previous research results in the collection.
  - variable_name: query_count
    variable_description: The number of research queries in the collection.
  - variable_name: items_list
    variable_description: A formatted list of all items in the collection with their
      types and content previews.
- function_tag: section_synthesis
  variables:
  - variable_name: question_text
    variable_description: The specific research sub-question to be answered in this
      section.
  - variable_name: context
    variable_description: The assembled context from relevant collection items including
      excerpts and research results.
  - variable_name: sources_list
    variable_description: A formatted list of source citations with author, title,
      and year information for proper attribution.
- function_tag: synthesis
  variables:
  - variable_name: research_goal
    variable_description: The overarching research goal statement that guides the
      synthesis of all sections.
  - variable_name: section_contents
    variable_description: The combined content from all generated research sections
      that need to be synthesized into a cohesive final report.
- function_tag: quality_evaluation
  variables:
  - variable_name: content
    variable_description: The research section content to be evaluated for quality,
      citation coverage, and coherence.
  - variable_name: sources_list
    variable_description: The list of available sources that should be cited in the
      content for comprehensive coverage assessment.
- function_tag: summarize_node
  variables:
  - variable_name: heading_path
    variable_description: The full path of the heading being summarized (e.g., "Introduction > Background").
  - variable_name: line_start
    variable_description: The starting line number of the section in the original document.
  - variable_name: line_end
    variable_description: The ending line number of the section in the original document.
  - variable_name: snippets
    variable_description: The actual text snippets from the section, including line numbers.
  - variable_name: keyphrases
    variable_description: A list of key concepts or phrases to specifically look for in this section.
- function_tag: synthesize_abstract
  variables:
  - variable_name: work_title
    variable_description: The title of the document being summarized.
  - variable_name: gists
    variable_description: A compiled list of gists (summaries) from all sections of the document.
- function_tag: organize_key_concepts
  variables:
  - variable_name: concepts
    variable_description: A raw list of extracted concepts, terms, and definitions to be organized.
  - variable_name: work_title
    variable_description: The title of the document from which the concepts were extracted.