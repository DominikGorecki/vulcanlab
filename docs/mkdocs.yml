site_name: VulcanLab
site_description: VulcanLab v0.6.0
docs_dir: src                   # Source markdown files are in docs/src/
site_dir: site                  # Build output goes to docs/site/
theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - yaml
    - python
    - ts
    - js
  logo: img/logo-sm.png
  favicon: img/favicon.ico
plugins:
  - glightbox
nav:
  - Home: index.md
  - Getting Started:
    - getting-started.md
    - Docker Setup: docker_setup.md
    - Running Locally: running_locally.md
    - Windows Setup (WSL): windows_setup.md
  - Guide:
    - RAG Walkthrough: pages/Walkthrough-RAG.md
    - VulcanLab Pages: pages/index.md
    - Settings Guide: settings-guide.md
    - RAG Settings Guide: rag-settings-guide.md
  - Technical Documentation:
    - RAG Pipeline: rag-pipeline.md
repo_url: https://github.com/DominikGorecki/vulcanlab
edit_uri: edit/main/docs/src/